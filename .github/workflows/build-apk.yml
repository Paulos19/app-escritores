name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build APK (Kotlin / Jetpack Compose)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kotlin

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🐘 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧹 Clean project
        run: ./gradlew clean

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-escritores-debug-apk
          path: kotlin/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🏗️ Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-escritores-release-apk
          path: kotlin/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
